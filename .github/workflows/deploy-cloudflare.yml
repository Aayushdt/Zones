# Optional manual deployment. It does nothing until the repository variables
# and secret listed below are configured and a maintainer dispatches this workflow.
name: Deploy to Cloudflare Pages (manual)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Check deployment settings
        id: settings
        env:
          CF_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ -z "$CF_ACCOUNT_ID" || -z "$CF_PROJECT_NAME" || -z "$CF_API_TOKEN" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare Pages is not configured; deployment skipped. See README.md."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.settings.outputs.configured == 'true'

      - uses: pnpm/action-setup@v6
        if: steps.settings.outputs.configured == 'true'
        with:
          version: 12.14.0

      - uses: actions/setup-node@v4
        if: steps.settings.outputs.configured == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        if: steps.settings.outputs.configured == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build PWA
        if: steps.settings.outputs.configured == 'true'
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_MAP_STYLE_URL: ${{ vars.VITE_MAP_STYLE_URL }}
        run: pnpm --filter @xzones/web build

      - name: Deploy to Cloudflare Pages
        if: steps.settings.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/web/dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=${{ github.ref_name }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
