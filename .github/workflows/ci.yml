name: CI

on:
  push:
    branches: [main, feat/phase-a, fix/audit-findings]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: xzones
          POSTGRES_PASSWORD: xzones
          POSTGRES_DB: xzones
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xzones -d xzones"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Install PostgreSQL server binaries for isolated database audits
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql
          echo "$(pg_config --bindir)" >> "$GITHUB_PATH"
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:unit
      - run: pnpm test:audit
      - run: pnpm verify:payloads
      - run: pnpm test:edge
      - run: pnpm test:api
      - run: pnpm test:sim
      - run: pnpm test:e2e
      - run: pnpm test:db
      - run: bash scripts/test-schema.sh
        env:
          DATABASE_URL: postgresql://xzones:xzones@localhost:5432/xzones
      - run: pnpm --filter @xzones/web build
      - name: Verify Web Asset Bundle Budgets
        run: node scripts/check-bundle-budget.mjs

  supabase-realtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      SUPABASE_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start real local Supabase stack and expose test connection values
        working-directory: backend/supabase
        run: |
          pnpm exec supabase start > /tmp/xzones-supabase-start.log 2>&1
          pnpm exec supabase status -o env > /tmp/xzones-supabase.env
          set -a
          . /tmp/xzones-supabase.env
          set +a
          {
            printf 'SUPABASE_API_URL=%s\n' "$API_URL"
            printf 'SUPABASE_DB_URL=%s\n' "$DB_URL"
            printf 'SUPABASE_ANON_KEY=%s\n' "$ANON_KEY"
          } >> "$GITHUB_ENV"
      - name: Serve the API Edge Function with ephemeral test secrets
        working-directory: backend/supabase
        run: |
          umask 077
          printf 'JOIN_CODE_HMAC_SECRET=%s\nRATE_LIMIT_HASH_SECRET=%s\n' \
            "$(openssl rand -hex 32)" "$(openssl rand -hex 32)" > /tmp/xzones-function.env
          nohup pnpm exec supabase functions serve api --no-verify-jwt --env-file /tmp/xzones-function.env \
            > /tmp/xzones-function.log 2>&1 &
          for attempt in $(seq 1 40); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "$SUPABASE_API_URL/functions/v1/api" || true)
            if [ "$code" != '000' ]; then exit 0; fi
            sleep 1
          done
          cat /tmp/xzones-function.log
          exit 1
      - name: Install PostgreSQL client for ephemeral-storage assertion
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: pnpm test:realtime-integration
